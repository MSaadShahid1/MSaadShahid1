  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace; }
    .blob { transform-box: fill-box; transform-origin: center; animation: drift 16s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(70px, -30px) scale(1.18); } }
    .star { animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
    .fade { opacity: 0; animation: fadeUp .9s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .edge { stroke: #c4b5fd; stroke-opacity: .13; stroke-width: 1.2; fill: none; }
    .signal { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 9 100; animation: flow 2.6s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 109; } to { stroke-dashoffset: 0; } }
    .node { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.45); opacity: 1; } }
    .hello { font-size: 26px; fill: #a5b4fc; font-weight: 600; }
    .name { font-size: 76px; font-weight: 800; letter-spacing: -1.5px; }
    .role { font-size: 23px; fill: #e2e8f0; font-weight: 600; }
    .dot { fill: #ff4f9a; }
    .prompt { font-size: 24px; fill: #ff4f9a; font-weight: 700; }
    .typed { font-size: 22px; fill: #67e8f9; }
    .chip { font-size: 16px; fill: #e2e8f0; font-weight: 600; }
  </style>
