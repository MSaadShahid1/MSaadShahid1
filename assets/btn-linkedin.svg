<svg xmlns="http://www.w3.org/2000/svg" width="300" height="130" viewBox="0 0 300 130" role="img" aria-label="LINKEDIN — LET&#x27;S CONNECT"><title>LINKEDIN — LET'S CONNECT</title><defs><style>@font-face{font-family:'Bangers';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Chakra Petch';font-weight:700;src:url(data:font/woff;base64,) format('woff')}
