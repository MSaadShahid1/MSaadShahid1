<svg xmlns="http://www.w3.org/2000/svg" width="900" height="444" viewBox="0 0 900 444" role="img" aria-label="Terminal: about Muhammad Saad">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11142a"/><stop offset="1" stop-color="#0a0c1a"/></linearGradient>
    <linearGradient id="tborder" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4f9a"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="tglow"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace; font-size: 17px; }
    .user { fill: #ff4f9a; font-weight: 700; }
    .path { fill: #22d3ee; font-weight: 700; }
    .muted { fill: #64748b; }
    .cmd { fill: #f8fafc; font-weight: 600; }
    .out { fill: #cbd5e1; }
    .ok { fill: #86efac; font-weight: 700; }
    .title { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; fill: #94a3b8; font-weight: 600; }
    .line { opacity: 0; animation: show .45s ease forwards; }
    @keyframes show { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect x="1" y="1" width="898" height="442" rx="18" fill="url(#tbg)" stroke="url(#tborder)" stroke-width="2"/>
  <circle cx="760" cy="404" r="260" fill="url(#tglow)"/>
  <rect x="1" y="1" width="898" height="46" rx="18" fill="#ffffff" fill-opacity=".04"/>
  <circle cx="30" cy="24" r="7" fill="#ff5f57"/><circle cx="54" cy="24" r="7" fill="#febc2e"/><circle cx="78" cy="24" r="7" fill="#28c840"/>
  <text x="450" y="29" text-anchor="middle" class="title">saad@github — zsh</text>
  <g class="line" style="animation-delay:0.4s"><text x="32" y="104" class="mono"><tspan class="user">saad@github</tspan><tspan class="muted">:</tspan><tspan class="path">~</tspan><tspan class="muted">$ </tspan><tspan class="cmd">whoami</tspan></text></g><g class="line" style="animation-delay:1.1s"><text x="32" y="134" class="mono out">Muhammad Saad — AI &amp; Web Developer from Islamabad, Pakistan</text></g><g class="line" style="animation-delay:1.5s"><text x="32" y="164" class="mono"><tspan class="user">saad@github</tspan><tspan class="muted">:</tspan><tspan class="path">~</tspan><tspan class="muted">$ </tspan><tspan class="cmd">cat focus.txt</tspan></text></g><g class="line" style="animation-delay:2.2s"><text x="32" y="194" class="mono out">▹ Computer vision &amp; deep learning with PyTorch and TensorFlow</text></g><g class="line" style="animation-delay:2.6s"><text x="32" y="224" class="mono out">▹ LLM-powered tools and NLP</text></g><g class="line" style="animation-delay:3.0s"><text x="32" y="254" class="mono out">▹ Fast, polished web apps — React, Laravel, Vue</text></g><g class="line" style="animation-delay:3.3s"><text x="32" y="284" class="mono"><tspan class="user">saad@github</tspan><tspan class="muted">:</tspan><tspan class="path">~</tspan><tspan class="muted">$ </tspan><tspan class="cmd">cat thesis.txt</tspan></text></g><g class="line" style="animation-delay:4.1s"><text x="32" y="314" class="mono out">Breast-cancer classification &amp; segmentation from MRI (MS in AI)</text></g><g class="line" style="animation-delay:4.4s"><text x="32" y="344" class="mono"><tspan class="user">saad@github</tspan><tspan class="muted">:</tspan><tspan class="path">~</tspan><tspan class="muted">$ </tspan><tspan class="cmd">echo $STATUS</tspan></text></g><g class="line" style="animation-delay:5.2s"><text x="32" y="374" class="mono ok">Open to freelance work and collaborations ✅</text></g><g class="line" style="animation-delay:5.5s"><text x="32" y="404" class="mono"><tspan class="user">saad@github</tspan><tspan class="muted">:</tspan><tspan class="path">~</tspan><tspan class="muted">$ </tspan></text><rect x="212" y="387" width="11" height="21" fill="#ff4f9a" class="cursor"/></g>
