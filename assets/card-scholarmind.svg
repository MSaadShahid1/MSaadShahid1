<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-label="ScholarMind">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121633"/><stop offset="1" stop-color="#0b0d1d"/></linearGradient>
    <linearGradient id="cb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="560" y2="200">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#8b5cf6" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 280 100;360 280 100" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="cglow"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".4"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <clipPath id="cc"><rect x="1" y="1" width="558" height="198" rx="20"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 24px; font-weight: 800; fill: #f8fafc; }
    .desc { font-size: 15.5px; fill: #cbd5e1; }
    .tag { font-size: 12.5px; font-weight: 700; fill: #e2e8f0; }
    .lang { font-size: 13px; font-weight: 600; fill: #94a3b8; }
    .glow { transform-box: fill-box; transform-origin: center; animation: breathe 5s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: .6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }
  </style>
  <g clip-path="url(#cc)">
    <rect width="560" height="200" fill="url(#cbg)"/>
    <circle class="glow" cx="500" cy="20" r="170" fill="url(#cglow)"/>
  </g>
  <rect x="1" y="1" width="558" height="198" rx="20" fill="none" stroke="url(#cb)" stroke-width="2"/>
  <text x="28" y="56" font-size="30">🎓</text>
  <text x="74" y="54" class="title">ScholarMind</text>
  <text x="522" y="50" font-size="22" fill="#8b5cf6" text-anchor="end" font-weight="700">↗</text>
  <text y="90" class="desc"><tspan x="28" dy="0">LLM-powered academic co-author: semantic paper</tspan><tspan x="28" dy="22">search, research questions and structured writing.</tspan></text>
  <rect x="28" y="146" width="54" height="28" rx="14" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".45"/><text x="55" y="165" text-anchor="middle" class="tag">LLMs</text><rect x="90" y="146" width="47" height="28" rx="14" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".45"/><text x="114" y="165" text-anchor="middle" class="tag">NLP</text><rect x="145" y="146" width="70" height="28" rx="14" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".45"/><text x="180" y="165" text-anchor="middle" class="tag">Python</text><rect x="223" y="146" width="138" height="28" rx="14" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".45"/><text x="292" y="165" text-anchor="middle" class="tag">Team · ITSOLERA</text>
  <circle cx="400" cy="160" r="6" fill="#da5b0b"/>
  <text x="532" y="165" text-anchor="end" class="lang">Jupyter Notebook</text>
</svg>
