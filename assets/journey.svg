ay:1.55s"/><text x="599" y="214" text-anchor="middle" class="year" fill="#22d3ee">2021</text><text x="599" y="238" text-anchor="middle" class="t">AI Developer Intern</text><text x="599" y="258" text-anchor="middle" class="p">DataYard</text></g><g class="pop" style="animation-delay:1.90s"><line x1="762" y1="118" x2="762" y2="150" stroke="#8b5cf6" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 4"/><circle cx="762" cy="150" r="15" fill="#8b5cf6" opacity=".2"/><circle cx="762" cy="150" r="7.5" fill="#8b5cf6" class="beat" style="animation-delay:1.90s"/><text x="762" y="70" text-anchor="middle" class="year" fill="#8b5cf6">2022</text><text x="762" y="94" text-anchor="middle" class="t">Data Mining (part-time)</text><text x="762" y="114" text-anchor="middle" class="p">Ares Projects</text></g><g class="pop" style="animation-delay:2.25s"><line x1="925" y1="150" x2="925" y2="182" stroke="#fbbf24" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 4"/><circle cx="925" cy="150" r="15" fill="#fbbf24" opacity=".2"/><circle cx="925" cy="150" r="7.5" fill="#fbbf24" class="beat" style="animation-delay:2.25s"/><text x="925" y="214" text-anchor="middle" class="year" fill="#fbbf24">2024</text><text x="925" y="238" text-anchor="middle" class="t">MS Artificial Intelligence</text><text x="925" y="258" text-anchor="middle" class="p">Air University · CV thesis</text></g><g class="pop" style="animation-delay:2.60s"><line x1="1088" y1="118" x2="1088" y2="150" stroke="#ff4f9a" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 4"/><circle cx="1088" cy="150" r="15" fill="#ff4f9a" opacity=".2"/><circle cx="1088" cy="150" r="7.5" fill="#ff4f9a" class="beat" style="animation-delay:2.60s"/><text x="1088" y="70" text-anchor="middle" class="year" fill="#ff4f9a">Now</text><text x="1088" y="94" text-anchor="middle" class="t">Freelance AI &amp; Web Engineer</text><text x="1088" y="114" text-anchor="middle" class="p">Open to new projects</text></g>
