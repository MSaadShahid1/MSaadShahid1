<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="Career journey timeline from 2017 to now">
  <defs>
    <linearGradient id="jl" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="1140" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff4f9a"/></linearGradient>
    <linearGradient id="jbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1024"/><stop offset="1" stop-color="#160f2c"/></linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .year { font-size: 20px; font-weight: 800; }
    .t { font-size: 15px; font-weight: 700; fill: #f1f5f9; }
    .p { font-size: 13px; fill: #94a3b8; }
    .draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 2.8s cubic-bezier(.65,0,.35,1) .2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .pop { opacity: 0; animation: pop .7s cubic-bezier(.34,1.56,.64,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 2.4s ease-in-out infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
  </style>
  <rect x="1" y="1" width="1198" height="288" rx="22" fill="url(#jbg)" stroke="#ffffff" stroke-opacity=".08"/>
  <path d="M60 150 H1140" stroke="#ffffff" stroke-opacity=".08" stroke-width="4" stroke-linecap="round"/>
  <path d="M60 150 H1140" pathLength="100" class="draw" stroke="url(#jl)" stroke-width="4" stroke-linecap="round"/>
